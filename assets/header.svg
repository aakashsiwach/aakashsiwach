<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Aakash Siwach — Project Lead, SDE II, Backend and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/><stop offset="1" stop-color="#0f1424"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".7"/><stop offset=".5" stop-color="#a78bfa" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity=".6"/>
    </linearGradient>
    <radialGradient id="b1"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <radialGradient id="b2"><stop offset="0" stop-color="#22d3ee" stop-opacity=".38"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="b3"><stop offset="0" stop-color="#f472b6" stop-opacity=".3"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="1198" height="298" rx="24"/></clipPath>
    <style>
      .name { font: 800 64px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; letter-spacing: -1.5px; }
      .sub  { font: 600 22px 'Segoe UI', Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif; fill: #9aa6bf; }
      .type { font: 600 22px 'Fira Code', 'JetBrains Mono', Consolas, Menlo, monospace; fill: #22d3ee; }
      .pill { font: 700 15px 'Segoe UI', Inter, system-ui, sans-serif; fill: #34d399; }
      .chip { font: 700 15px 'Fira Code', Consolas, Menlo, monospace; fill: #e7ecf5; }
    </style>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="980" cy="40" r="260" fill="url(#b1)"><animate attributeName="cx" values="980;900;980" dur="14s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="300" r="240" fill="url(#b2)"><animate attributeName="cy" values="300;250;300" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="1150" cy="300" r="200" fill="url(#b3)"><animate attributeName="cx" values="1150;1080;1150" dur="16s" repeatCount="indefinite"/></circle>

    <!-- status pill -->
    <rect x="80" y="44" width="218" height="34" rx="17" fill="#34d399" fill-opacity=".1" stroke="#34d399" stroke-opacity=".4"/>
    <circle cx="101" cy="61" r="5" fill="#34d399"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
    <text x="115" y="66" class="pill">Open to opportunities</text>

    <text x="78" y="146" class="name" fill="url(#name)">Aakash Siwach</text>
    <text x="80" y="182" class="sub">Project Lead · SDE II @ Innostax · Backend &amp; AI Engineer</text>
    
    <clipPath id="c0"><rect x="0" y="196" height="40" width="0">
      <animate attributeName="width" dur="15.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.0733;0.1993;0.2000;1.0000" values="0;760;760;0;0"/></rect></clipPath>
    <g clip-path="url(#c0)" opacity="0">
      <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0.0000;0.1833;0.2000;1.0000" values="1;0;0;0"/>
      <text x="80" y="224" class="type">&gt; Java · Spring Boot microservices</text>
    </g>
    <clipPath id="c1"><rect x="0" y="196" height="40" width="0">
      <animate attributeName="width" dur="15.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.2000;0.2733;0.3993;0.4000;1.0000" values="0;0;760;760;0;0"/></rect></clipPath>
    <g clip-path="url(#c1)" opacity="0">
      <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0.0000;0.1999;0.2000;0.3833;0.4000;1.0000" values="0;0;1;0;0;0"/>
      <text x="80" y="224" class="type">&gt; Python · FastAPI · AI agents</text>
    </g>
    <clipPath id="c2"><rect x="0" y="196" height="40" width="0">
      <animate attributeName="width" dur="15.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.4000;0.4733;0.5993;0.6000;1.0000" values="0;0;760;760;0;0"/></rect></clipPath>
    <g clip-path="url(#c2)" opacity="0">
      <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0.0000;0.3999;0.4000;0.5833;0.6000;1.0000" values="0;0;1;0;0;0"/>
      <text x="80" y="224" class="type">&gt; RAG over codebases with cited answers</text>
    </g>
    <clipPath id="c3"><rect x="0" y="196" height="40" width="0">
      <animate attributeName="width" dur="15.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.6000;0.6733;0.7993;0.8000;1.0000" values="0;0;760;760;0;0"/></rect></clipPath>
    <g clip-path="url(#c3)" opacity="0">
      <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0.0000;0.5999;0.6000;0.7833;0.8000;1.0000" values="0;0;1;0;0;0"/>
      <text x="80" y="224" class="type">&gt; Payment systems · 3DS · PCI DSS</text>
    </g>
    <clipPath id="c4"><rect x="0" y="196" height="40" width="0">
      <animate attributeName="width" dur="15.0s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0.0000;0.8000;0.8733;0.9993;1.0000" values="0;0;760;760;0"/></rect></clipPath>
    <g clip-path="url(#c4)" opacity="0">
      <animate attributeName="opacity" dur="15.0s" repeatCount="indefinite" calcMode="discrete"
        keyTimes="0.0000;0.7999;0.8000;0.9833;1.0000" values="0;0;1;0;0"/>
      <text x="80" y="224" class="type">&gt; Leading a team of 9+ engineers</text>
    </g>

    <!-- right side: floating code chips -->
    <g transform="translate(860 96)">
      <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="6s" repeatCount="indefinite"/>
        <rect width="230" height="40" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="16" y="26" class="chip"><tspan fill="#a78bfa">@</tspan>RestController</text></g>
      <g transform="translate(40 58)"><animateTransform attributeName="transform" type="translate" values="40 58;40 66;40 58" dur="7s" repeatCount="indefinite"/>
        <rect width="230" height="40" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="16" y="26" class="chip"><tspan fill="#22d3ee">rag</tspan>.ask(<tspan fill="#f472b6">"why?"</tspan>)</text></g>
      <g transform="translate(-10 116)"><animateTransform attributeName="transform" type="translate" values="-10 116;-10 108;-10 116" dur="8s" repeatCount="indefinite"/>
        <rect width="230" height="40" rx="12" fill="#ffffff" fill-opacity=".05" stroke="#ffffff" stroke-opacity=".12"/>
        <text x="16" y="26" class="chip">recall@5 <tspan fill="#34d399">0.812</tspan></text></g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="none" stroke="url(#ring)" stroke-width="2"/>
</svg>
